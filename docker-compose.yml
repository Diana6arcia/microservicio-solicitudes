services:

  mysql:
    image: mysql:8.4
    container_name: solicitudes-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: solicitudes_db

    ports:
      - '3306:3306'

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - solicitudes-network

  sftp:
    image: atmoz/sftp
    container_name: mule-sftp
    restart: unless-stopped

    ports:
      - '2222:22'

    volumes:
      - ./sftp/upload:/home/mule/upload

    command: mule:mule123:::upload

    networks:
      - solicitudes-network


volumes:
  mysql_data:


networks:
  solicitudes-network:
    driver: bridge
